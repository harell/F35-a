name: Build & deploy F35-A

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # The tests, with coverage (npm run coverage: a longer per-test timeout, instrumented runs are ~3× slower); the
      # summary becomes the README's badge (tools/coverage-badge.mjs). Under coverage Vitest can exit 1 on internal
      # worker RPC timeouts after every test passed, so the gate is the JSON results, not the exit code: the next
      # step fails the job on any failed test or on missing results (PRs still run the plain `vitest run`, ci.yml).
      - run: npm run coverage -- --reporter=default --reporter=json --outputFile.json=coverage/test-results.json || true
      - run: node tools/check-test-results.mjs coverage/test-results.json
      - run: npx vite build
        env:
          # Shown in-game as "Build N" and tagged in Clarity; trace it back to run #N of this workflow.
          VITE_BUILD_NUMBER: ${{ github.run_number }}
      - run: node tools/coverage-badge.mjs dist/badges/coverage.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Deploy on manual dispatch or on pushes to the repository's default branch.
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
