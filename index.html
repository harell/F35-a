<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05080c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="F35-A" />
    <meta name="description" content="F35-A Ratites — combat flight simulator for your phone. Fly the F-35A Lightning II: dogfights, SAM suppression, deep strike." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <title>F35-A Ratites</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05080c; }
      body { position: fixed; inset: 0; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #d8e6f0; }
      #app { position: absolute; inset: 0; overflow: hidden; }
      #gl, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #gl { z-index: 0; }
      #hud { z-index: 10; pointer-events: none; }
      #controls { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
      #ui { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
      #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px;
        background: #05080c; color: #f88; font-size: 18px; z-index: 100; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <canvas id="hud"></canvas>
      <div id="controls"></div>
      <div id="ui"></div>
    </div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
